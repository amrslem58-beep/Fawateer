</style></head><body>
<h1>فواتير اليوم <span class="mu" id="dt"></span></h1><div class="mu" id="sv"></div><button class="g" id="gs" style="margin-top:6px">⚙ إعدادات القراءة (مفتاح Gemini)</button>
<div class="cd" id="cfg" style="display:none"><div class="mu"><b>ربط القراءة الذكية (مرة واحدة بس)</b><br>1) دوس الزرار تحت وسجّل بحساب جوجل.<br>2) دوس <b>Create API key</b>.<br>3) انسخ المفتاح.<br>4) الصقه هنا ودوس <b>حفظ</b>.</div><a class="btn" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style="margin:8px 0;text-decoration:none">🔑 افتح صفحة المفتاح</a><input id="gk" type="password" placeholder="الصق المفتاح هنا" dir="ltr"><input id="gm" dir="ltr" style="display:none"><button style="margin-top:8px" id="gsv">حفظ</button> <button class="g" style="margin-top:8px" id="gl">🔗 لينك بالمفتاح (يتبعت لواحد معاك)</button> <button class="g" style="margin-top:8px" id="gsh">📤 شارك التطبيق</button><input id="gu" readonly dir="ltr" style="display:none;margin-top:8px"><div class="mu" style="margin-top:12px"><b>نسخة احتياطية للبيانات</b> (ابعتها لنفسك على الواتساب)</div><button class="g" style="margin-top:6px" onclick="bkExport()">💾 احفظ نسخة</button> <label class="btn" style="background:transparent;border:1px solid var(--bd);color:var(--tx);margin-top:6px">📥 استرجاع<input type="file" accept=".json,application/json" hidden onchange="bkImport(this)"></label><div class="mu" id="bn"></div></div>
<label class="btn big" style="text-align:center;margin-top:8px" id="up">📷 ضيف صور الفواتير<input type="file" id="fi" accept="image/*" multiple hidden></label>
<div class="mu" id="st" style="margin-top:6px"></div><button class="g" id="nd" style="margin-top:6px">🗑 ابدأ يوم جديد (مسح كل حاجة)</button>

<div id="v"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
r2=x=>Math.round((+x||0)*100)/100,f=x=>r2(x).toLocaleString('en-US',{maximumFractionDigits:2});
const d=new Date(),KEY=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
$('#dt').textContent=KEY;
let S={inv:[],exp:[]},tab=1,confirmId=null,KEY_=localStorage.getItem('gk')||'',MODEL=localStorage.getItem('gm')||'gemini-2.5-flash';
const CAT=['ارز فرن','ارز بالكريمه','قرع عسل','مهلبيه فرن','ارز ساده','ساده كبير','كاستر ساده','جيلي بالكاستر','عاشورة','ام على','ارز كنافه بسبوسه مكسرات','ارز نص ونص','ارز صغير مشكل','ارز كبير مشكل','ارز باللوتس','بريفترول','زبادي كبير','قنبله','قشطوطه','كاب كيك','تشيز كيك','مولتون نوتيلا','ديسباسيتو ميكس','دفع آجل'];
const nk=n=>String(n).replace(/[_\u0640]/g,' ').replace(/\s+/g,' ').trim().replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
const k2=n=>nk(n).replace(/[\s\u200b-\u200f\u064b-\u065f]/g,'');
const ed=(a,b)=>{if(Math.abs(a.length-b.length)>1)return 9;const d=[];for(let i=0;i<=a.length;i++)d[i]=[i];for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[a.length][b.length]};
function canon(n){const c=String(n).replace(/[_\u0640]/g,' ').replace(/\s+/g,' ').trim(),k=k2(c),all=[...CAT,...S.inv.flatMap(v=>v.items.map(i=>i.name)),...(S.load||[]).map(i=>i.name),...(S.cnt||[]).map(i=>i.name)];for(const a of all){const b=k2(a);if(b==k||(Math.min(b.length,k.length)>=8&&(b.startsWith(k)||k.startsWith(b)))||(k.length>=7&&ed(b,k)<=1))return a}return c}
function fix(){const ks=CAT.map(nk);S.inv.forEach(v=>{v.items.forEach(i=>i.name=canon(i.name));v.items=v.items.filter(i=>{const k=nk(i.name);return ks.includes(k)||!v.items.some(o=>o!==i&&nk(o.name)!=k&&nk(o.name).includes(k))})});['load','cnt'].forEach(t=>S[t]&&S[t].forEach(i=>i.name=canon(i.name)))}
const PROMPT='This is a photo of ONE sales invoice (Arabic). Reply with ONLY JSON: {"no":number,"time":"HH:MM","customer":string,"items":[{"name":string,"qty":number,"price":number}],"total":number,"after":number,"paid":number,"debt":number}. total = الاجمالي, after = بعد الخصم, paid = مدفوع, debt = المديونيه السابقة (0 if none). Copy Arabic names exactly as printed. Use western digits. If not an invoice reply {"error":"not invoice"}. A product name can wrap onto two lines (e.g. ارز كنافه_بسبوسه_مك / سرات): that is ONE item, join the lines and replace underscores with spaces. When a printed name matches one of these, use it exactly: '+CAT.join(', ')+'.';
function b64(file){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.85).split(',')[1])};im.onerror=()=>no(Object.assign(new Error('x'),{detail:'الصورة معرفتش تتفتح'}));im.src=u})}
const ST={async set(k,v){localStorage.setItem(k,JSON.stringify(v))},async del(k){localStorage.removeItem(k)},async list(){const r=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^(day|arc)-/.test(k))try{r.push({k,v:JSON.parse(localStorage.getItem(k))})}catch(e){}}return r}};
const sample={async json(prompt,o){if(!KEY_)throw Object.assign(new Error('key'),{code:'not_granted'});
 const d=await b64(o.images);let last=null;
 for(const m of ['gemini-flash-lite-latest','gemini-flash-latest']){let r;try{r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':KEY_},body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:'image/jpeg',data:d}}]}],generationConfig:{responseMimeType:'application/json',temperature:0}})})}catch(e){throw Object.assign(e,{code:'net',detail:'مفيش اتصال بالنت أو الطلب اتحجب'})}
  if(r.ok){const j=await r.json(),p=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts,t=p?p.map(x=>x.text||'').join(''):'';if(!t)throw Object.assign(new Error('empty'),{detail:'رد فاضي '+((j.promptFeedback&&j.promptFeedback.blockReason)||'')});return JSON.parse(t.replace(/```json|```/g,'').trim())}
  const tx=await r.text().catch(()=>'');last=Object.assign(new Error('http'),{status:r.status,detail:'HTTP '+r.status+' '+tx.replace(/\s+/g,' ').slice(0,150),code:r.status==429?'rate_limited':([401,403].includes(r.status)||(r.status==400&&/API key|key not valid/i.test(tx)))?'not_granted':'http'});
  if(![404,429,500,503].includes(r.status))break}
 throw last}};
let PEND=null;
const dl={async save(o){const f=new File([o.data],o.filename,{type:o.data.type});PEND=f;
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});msg('اتبعتت ✓');return}catch(e){if(e&&e.name=='AbortError'){msg('اتلغت المشاركة');return}}msg('','<button class="big" onclick="sharePend()">📤 اضغط لمشاركة الصورة</button>');return}
 sharePend()}};
async function sharePend(){const f=PEND;if(!f)return;try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else throw 0}catch(e){if(e&&e.name=='AbortError')return;const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();msg('اتحمّلت الصورة على الجهاز')}}
async function bkExport(){const o={v:1,at:Date.now(),data:{}};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^(day|arc)-/.test(k))o.data[k]=localStorage.getItem(k)}
 localStorage.setItem('lastbk',Date.now());bkNote();await dl.save({filename:'نسخة-فواتير-'+KEY+'.json',data:new Blob([JSON.stringify(o)],{type:'application/json'})})}
function bkImport(el){const f=el.files[0];el.value='';if(!f)return;f.text().then(t=>{const o=JSON.parse(t);let n=0;for(const k in o.data)if(/^(day|arc)-/.test(k)){localStorage.setItem(k,o.data[k]);n++}msg('اتسترجع '+n+' يوم');const v=localStorage.getItem('day-'+KEY);if(v)S=Object.assign({inv:[],exp:[]},JSON.parse(v));render()}).catch(()=>msg('الملف ده مش نسخة احتياطية صحيحة'))}
function bkNote(){const t=+localStorage.getItem('lastbk')||0;$('#bn').textContent=t?'آخر نسخة احتياطية: '+new Date(t).toLocaleString('ar-EG'):'لسه معملتش نسخة احتياطية'}
function init(){const hm=location.hash.match(/k=([^&]+)/);if(hm){KEY_=decodeURIComponent(hm[1]);localStorage.setItem('gk',KEY_);history.replaceState(null,'',location.pathname+location.search)}
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
 $('#gl').onclick=()=>{const u=$('#gu');u.style.display='block';u.value=location.origin+location.pathname+'#k='+$('#gk').value.trim();u.select();if($('#gk').value.trim()&&navigator.share)navigator.share({url:u.value}).catch(()=>{})};
 $('#gsh').onclick=()=>{const u=location.origin+location.pathname;if(navigator.share)navigator.share({title:'فواتير اليوم',text:'تطبيق فواتير اليوم',url:u}).catch(()=>{});else{const i=$('#gu');i.style.display='block';i.value=u;i.select()}};try{const v=localStorage.getItem('day-'+KEY);if(v)S=Object.assign({inv:[],exp:[]},JSON.parse(v))}catch(e){}
 $('#gs').onclick=()=>{const c=$('#cfg');c.style.display=c.style.display=='block'?'none':'block';$('#gk').value=KEY_;$('#gm').value=MODEL;bkNote()};
 $('#gsv').onclick=()=>{KEY_=$('#gk').value.trim();MODEL=$('#gm').value.trim()||'gemini-2.5-flash';localStorage.setItem('gk',KEY_);localStorage.setItem('gm',MODEL);$('#cfg').style.display='none';$('#sv').textContent='اتحفظ'};
 if(!KEY_)$('#cfg').style.display='block';
 $('#sv').textContent='نسخة 5 · البيانات بتتحفظ على التليفون ده'+(Date.now()-(+localStorage.getItem('lastbk')||0)>864e5?' · ⚠ خد نسخة احتياطية من ⚙':'');render()}
function save(){try{localStorage.setItem('day-'+KEY,JSON.stringify(S))}catch(e){$('#sv').textContent='فشل الحفظ'}}
const isum=v=>(v.items||[]).reduce((a,i)=>a+i.qty*i.price,0),T=v=>+v.total||isum(v),N=v=>v.after!=null&&v.after!==''?+v.after:T(v);
function calc(){let t=0,n=0,vo=0,aj=0;S.inv.forEach(v=>{t+=T(v);n+=N(v);vo+=+v.voda||0;aj+=+v.ajl||0});const ex=S.exp.reduce((a,e)=>a+(+e.amt||0),0);return{t,disc:t-n,n,vo,aj,cash:n-vo-aj,ex,fin:n-vo-aj-ex}}
$('#fi').onchange=async e=>{const L=[...e.target.files];e.target.value='';let i=0,bad=[],dup=[],lastE='';
 for(const file of L){i++;$('#st').textContent='بقرا الصورة '+i+' من '+L.length+'…';
  try{const r=await sample.json(PROMPT,{images:file});
   if(r.error||!Array.isArray(r.items)){lastE='الرد مش فاتورة: '+JSON.stringify(r).slice(0,120);bad.push(i);continue}
   if(S.inv.some(x=>x.no===r.no)){dup.push(r.no);continue}
   S.inv.push({no:r.no,time:r.time||'',customer:r.customer||'',items:r.items,total:r.total,after:r.after,paid:r.paid,debt:r.debt||0,voda:0});
   S.inv.sort((a,b)=>a.no-b.no);save();render();
  }catch(er){if(['not_granted','sampling_disabled','rate_limited'].includes(er.code)){$('#st').textContent=er.code=='rate_limited'?'استنى شوية وكمّل':'المفتاح مش شغال — راجع ⚙ الإعدادات'+(er.detail?' ('+er.detail+')':'');return}lastE=er.detail||er.message;bad.push(i)}}
 $('#st').textContent='خلص. '+(dup.length?'فواتير مكررة اتجاهلت: '+dup.join('، ')+'. ':'')+(bad.length?'صور مقرتش: '+bad.join('، ')+(lastE?' — السبب: '+lastE:''):'')};
$('#t1').onclick=()=>{tab=1;render()};$('#t2').onclick=()=>{tab=2;render()};$('#t3').onclick=()=>{tab=3;render()};
function render(){fix();$('#t1').className=tab==1?'':'g';$('#t2').className=tab==2?'':'g';$('#t1').textContent='الفواتير ('+S.inv.length+')';$('#t3').className=tab==3?'':'g';tab==1?inv():tab==2?rep():arc()}
function inv(){const c=calc();let h='';
 if(!S.inv.length)h='<div class="cd mu">لسه مفيش فواتير. دوس «ضيف صور الفواتير» واختار الصور.</div>';
 S.inv.forEach((v,k)=>{const bad=Math.abs(isum(v)-T(v))>0.5;
  h+=`<div class="cd"><div class="row"><b>#${esc(v.no)} · ${esc(v.customer)}</b><b>${f(N(v))}</b></div>
  <div class="mu">${isColl(v)?'تحصيل آجل (بدون نسبة) · ':''}${esc(v.time)} · إجمالي ${f(T(v))} · خصم ${f(T(v)-N(v))}${v.debt?' · مديونية سابقة '+f(v.debt):''}</div>
  ${bad?'<div class="w">⚠ مجموع الأصناف '+f(isum(v))+' مختلف عن الإجمالي — راجع الصورة</div>':''}
  <details><summary>الأصناف (${v.items.length})</summary><table>${v.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${f(i.qty)}</td><td>${f(i.price)}</td><td>${f(i.qty*i.price)}</td></tr>`).join('')}</table></details>
  <div class="row" style="align-items:center"><span class="mu" style="min-width:70px">فودافون</span><input type="number" inputmode="decimal" value="${+v.voda||''}" placeholder="0" onchange="S.inv[${k}].voda=+this.value||0;save()"><button class="g" onclick="setAll(${k},'voda')">كله</button></div><div class="row" style="align-items:center"><span class="mu" style="min-width:70px">آجل</span><input type="number" inputmode="decimal" value="${+v.ajl||''}" placeholder="0" onchange="S.inv[${k}].ajl=+this.value||0;save()"><button class="g" onclick="setAll(${k},'ajl')">كله</button></div><div class="row"><span class="mu">نقدي: ${f(N(v)-(+v.voda||0)-(+v.ajl||0))}</span><button class="g" onclick="del(${k})">${confirmId===k?'تأكيد؟':'حذف'}</button></div></div>`});
 $('#v').innerHTML=h+(S.inv.length?`<div class="cd"><div class="row tot"><span>صافي الفواتير</span><span>${f(c.n)}</span></div></div>`:'')}
function del(k){if(confirmId===k){S.inv.splice(k,1);confirmId=null;save()}else confirmId=k;render()}
function rep(){const c=calc();
 $('#v').innerHTML=`<div class="cd"><div class="row"><span>عدد الفواتير</span><b>${S.inv.length}</b></div><div class="row"><span>الإجمالي</span><b>${f(c.t)}</b></div><div class="row"><span>الخصم</span><b>${f(c.disc)}</b></div><div class="row"><span>الصافي</span><b>${f(c.n)}</b></div><div class="row"><span>فودافون كاش</span><b>${f(c.vo)}</b></div><div class="row"><span>آجل</span><b>${f(c.aj)}</b></div><div class="row"><span>نقدي</span><b>${f(c.cash)}</b></div><div class="row"><span>مصاريف اليوم</span><b>${f(c.ex)}</b></div><div class="row tot"><span>النقدي بعد المصاريف</span><span>${f(c.fin)}</span></div></div>
 <div class="cd"><b>المصاريف</b>${S.exp.map((e,k)=>`<div class="row"><span>${esc(e.name)}</span><span>${f(e.amt)} <button class="g" onclick="S.exp.splice(${k},1);save();render()">✕</button></span></div>`).join('')}
 <div class="row"><input id="en" placeholder="البند"><input id="ea" type="number" inputmode="decimal" placeholder="المبلغ"><button onclick="addEx()">＋</button></div></div>
 ${extraUI()}<button class="big" onclick="png()">⬇ تقرير اليوم (PDF للواتساب)</button><button class="big" style="margin-top:8px" onclick="png2()">⬇ شيت العملاء بالأصناف (PDF)</button>
 <button class="big g" style="margin-top:8px" onclick="txt()">نسخ التقرير كنص</button><div id="sm" class="mu" style="margin-top:8px"></div><div id="tx"></div>`}
function addEx(){const n=$('#en').value.trim(),a=+$('#ea').value;if(!n||!a)return;S.exp.push({name:n,amt:a});save();render()}
function report(){const c=calc();let t='تقرير '+KEY+'\n\n';S.inv.forEach(v=>t+=v.no+' - '+v.customer+': '+f(N(v))+'\n');
 t+='\nالإجمالي: '+f(c.t)+'\nالخصم: '+f(c.disc)+'\nالصافي: '+f(c.n)+'\nفودافون كاش: '+f(c.vo)+'\nآجل: '+f(c.aj)+'\nنقدي: '+f(c.cash)+'\n';
 if(S.exp.length){t+='\nالمصاريف:\n';S.exp.forEach(e=>t+=e.name+': '+f(e.amt)+'\n')}{const k=chk(),m=rep2();t+='\nمرتب المندوب: '+f(m.com)+(k?'\nالمطابقة: '+k.t+(k.t=='مطابق'?'':' '+f(Math.abs(k.d))):'')}return t+'\nالنقدي بعد المصاريف: '+f(c.fin)}
function txt(){$('#tx').innerHTML='<textarea id="ta" readonly></textarea><button onclick="cp()">نسخ</button>';$('#ta').value=report()}
function cp(){const a=$('#ta');a.select();try{document.execCommand('copy')}catch(e){}}
const FN='"Segoe UI",Tahoma,Arial,sans-serif',z=n=>n?f(n):'–',f0=n=>Math.round(+n||0).toLocaleString('en-US');
